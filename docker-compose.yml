services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fraud
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fraud"]
      interval: 3s
      retries: 20

  fraud-engine-java:
    build: ./fraud-engine-java
    environment:
      DB_URL: jdbc:postgresql://db:5432/fraud
    ports: ["8090:8090"]
    depends_on:
      db: { condition: service_healthy }

  case-api-dotnet:
    build: ./case-api-dotnet
    environment:
      DB_CONN: Host=db;Port=5432;Database=fraud;Username=postgres;Password=postgres
    ports: ["8091:8091"]
    depends_on:
      db: { condition: service_healthy }
